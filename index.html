<style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#1d2330;--mute:#6b7280;--line:#e5e7eb;--band:#1F3864;--band2:#2f5597;--acc:#c5221f;--ok:#1e8e3e;--warn:#b06000;--info:#1967d2;--soft:#eef2f8}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;line-height:1.1;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.band{background:var(--band);color:#fff;padding:12px max(3vw,14px) 0}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-size:19px;margin-right:auto}.top h1 small{display:block;font:500 13px -apple-system,Segoe UI,Roboto,Arial,sans-serif;opacity:.7}
.search{flex:1 1 220px;max-width:360px;background:#ffffff1a;border:1px solid #ffffff33;border-radius:9px;padding:7px 11px;color:#fff}
.search::placeholder{color:#ffffffaa}
.btn{min-height:36px;padding:6px 12px;font-size:13.5px;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.ghost{background:transparent;color:#fff;border-color:#ffffff55}
.btn.sm{min-height:30px;padding:3px 9px;font-size:12.5px}.btn.link{border:0;background:none;color:var(--info);padding:4px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:3px solid #7fa6ff;outline-offset:1px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:16px 0 0;scrollbar-width:thin}
.chip{flex:none;border:0;background:transparent;color:#ffffffc0;padding:8px 12px 10px;border-radius:9px 9px 0 0;cursor:pointer;text-align:left;min-height:40px;font-size:13px}
.chip b{display:block;font-weight:600;color:#fff}.chip span{font-size:11.5px}
.chip.on{background:var(--bg);color:var(--ink)}.chip.on b{color:var(--ink)}
main{padding:16px max(3vw,14px) 50px;max-width:1400px;margin:0 auto}
.head{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.head h2{font-size:clamp(20px,2.4vw,26px);margin-right:auto}.head p{margin:4px 0 0;color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.kpi small{color:var(--mute);font-weight:500;font-size:12px}.kpi div{font:700 clamp(17px,1.9vw,21px) -apple-system,Segoe UI,Roboto,Arial,sans-serif;margin-top:4px;white-space:nowrap}
.kpi.hot{background:var(--acc);border-color:var(--acc);color:#fff}.kpi.hot small{color:#ffffffd0}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
@media(max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:14px}
.card h3{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{flex:none;border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--mute);font-weight:600;font-size:13.5px;border-bottom:3px solid transparent;min-height:38px}
.tab.on{color:var(--ink);border-color:var(--acc)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input{min-height:34px;font-size:13px;border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:6px 10px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--mute);font-size:12px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--soft);color:var(--mute)}
.p-ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.p-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.p-bad{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
.p-info{background:color-mix(in srgb,var(--info) 15%,transparent);color:var(--info)}
.sub{color:var(--mute);font-size:13px}
.alert{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.alert:last-child{border:0}.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--warn)}.dot.bad{background:var(--acc)}.dot.info{background:var(--info)}
.bars{display:flex;align-items:flex-end;gap:6px;height:190px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .col{width:100%;max-width:34px;background:var(--soft);border-radius:6px 6px 0 0;position:relative;overflow:hidden}
.bars .col i{position:absolute;left:0;right:0;bottom:0;background:var(--band2)}
.bars small{font-size:11.5px;color:var(--mute)}
.banner{background:#c5221f;color:#fff;padding:10px max(4vw,16px);display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-weight:600}
.banner button{background:#fff;color:#c5221f;border:0;border-radius:6px;padding:6px 14px;font-weight:700;cursor:pointer;min-height:34px}
.badge{background:#c5221f;color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:5px;font-weight:700}
#login{position:fixed;inset:0;background:#f3f4f6;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#login .box{background:#fff;padding:28px 24px;border-radius:12px;width:100%;max-width:360px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
#login h2{margin:0 0 4px;color:#1F3864;font-size:20px}#login p{margin:0 0 18px;color:#6b7280;font-size:13px}
#login label{display:block;font-size:13px;color:#374151;margin-bottom:12px}#login input{width:100%;margin-top:4px;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:16px}
#login button{width:100%;background:#1F3864;color:#fff;border:0;border-radius:8px;padding:11px;font-weight:700;font-size:15px;cursor:pointer}#login .e{color:#c5221f;font-size:13px;min-height:18px;margin-bottom:6px}
.lang{display:flex;border:1px solid rgba(255,255,255,.5);border-radius:8px;overflow:hidden}.lang button{background:none;border:0;color:#fff;padding:8px 11px;cursor:pointer;font-weight:700;min-height:40px}.lang button.on{background:#fff;color:#1F3864}
.empty{padding:28px;text-align:center;color:var(--mute)}
.flag{color:var(--acc);font-weight:700;font-size:12px}
/* drawer */
.ov{position:fixed;inset:0;background:#050b1c99;display:none;z-index:20}
.ov.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:21;transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer.big{width:100%}.drawer.big .db{padding-inline:max(18px,calc((100% - 1180px)/2))}.drawer.big .form{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}.drawer.big .df{justify-content:center}
#dFull{min-width:0}@media(max-width:760px){#dFull{display:none}}
.dh{background:var(--band);color:#fff;padding:11px 18px;display:flex;gap:10px;align-items:center}
.dh h3{font-size:16px;margin-right:auto}
.db{padding:14px 18px;overflow-y:auto;flex:1}
.df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:var(--panel)}
.df .grow{margin-right:auto}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form .full{grid-column:1/-1}
@media(max-width:600px){.form{grid-template-columns:minmax(0,1fr)}}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--mute)}
label.f input,label.f select,label.f textarea,.lines input,.lines select{min-height:36px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:6px 9px;font-size:14px;font-weight:400;color:var(--ink);width:100%}
textarea{min-height:70px;resize:vertical}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.step{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 11px;cursor:pointer;font-size:12.5px;font-weight:600;min-height:32px}
.step.done{background:var(--soft)}.step.on{background:var(--band);color:#fff;border-color:var(--band)}
.step.bad.on{background:var(--acc);border-color:var(--acc)}
.lines{width:100%;border-collapse:collapse;margin-top:6px}.lines td{padding:4px;border:0}.lines th{padding:4px}
.files{display:flex;flex-wrap:wrap;gap:8px}
.file{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:6px;display:flex;gap:8px;align-items:center;max-width:240px;font-size:13px}
.file img{width:52px;height:52px;object-fit:cover;border-radius:6px}
.file a{color:var(--info);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec{font:700 14px -apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:18px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ai{background:var(--soft);border-radius:12px;padding:12px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ai p{margin:0;flex:1 1 220px;font-size:13.5px;color:var(--mute)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--band);color:#fff;padding:10px 16px;border-radius:10px;z-index:40;display:none;max-width:90vw}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);border-radius:14px;padding:20px;z-index:31;width:min(420px,92vw);display:none}
.modal.on{display:block}.modal p{margin:0 0 16px}
.mback{position:fixed;inset:0;background:#050b1c99;z-index:30;display:none}.mback.on{display:block}
.hist{font-size:13px;color:var(--mute);margin:8px 0 0;padding-left:18px}
.tot{display:flex;justify-content:flex-end;gap:20px;flex-wrap:wrap;margin-top:8px;font-weight:600}
.diff{color:var(--acc);font-weight:700}
.ok{color:var(--ok);font-weight:700}
.note{font-size:13px;color:var(--mute);margin-top:10px}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute);font-size:12px}.stack td:empty{display:none}.top h1{font-size:19px}}
@media(prefers-reduced-motion:reduce){.drawer{transition:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;const h=c.closest('table').rows[0].cells[i]?.textContent||'';c.dataset.l=typeof tr==='function'?tr(h):h}}).observe(document,{childList:true,subtree:true})</script>

const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3200)};
const clone=o=>JSON.parse(JSON.stringify(o));
const strip=o=>{const c=clone(o);delete c.id;return c};
function ask(msg,ok='Confirmar'){return new Promise(res=>{$('#mText').textContent=msg;$('#mBtns').innerHTML=`<button class="btn" data-a="0">Cancelar</button><button class="btn pri" data-a="1">${esc(ok)}</button>`;
 $('#modal').classList.add('on');$('#mback').classList.add('on');$('#mBtns').onclick=e=>{const a=e.target.dataset.a;if(a==null)return;$('#modal').classList.remove('on');$('#mback').classList.remove('on');res(a==='1')}})}

/* ---------- money logic ---------- */
const lineSum=r=>(r.lines||[]).reduce((s,l)=>s+n(l.q||0)*n(l.p||0),0);
function recTotal(r){let t=lineSum(r);if(prov(r.pid).cat==='comissao')t+=n(r.base)*n(r.pct)/100;return Math.round(t*100)/100}
function rateFor(pid,route,item,date){return S.rates.filter(x=>x.pid===pid&&x.route===route&&x.item===item&&(x.from||'')<=(date||today())).sort((a,b)=>(b.from||'').localeCompare(a.from||''))[0]}
const routeOf=r=>r.origin&&r.dest?r.origin+'-'+r.dest:'';
function expected(r){if(prov(r.pid).cat!=='transporte'||!(r.lines||[]).length)return null;let t=0;
 for(const l of r.lines){if(!l.item)return null;const x=rateFor(r.pid,routeOf(r),l.item,r.date);if(!x)return null;t+=(x.per==='viagem'?1:n(l.q))*n(x.price)}return t}
const invPaid=i=>S.payments.filter(p=>p.invId===i.id).reduce((s,p)=>s+n(p.amount),0);
const invTotal=i=>Math.round((n(i.sub)-n(i.disc))*(1+n(i.vat)/100)*100)/100;
function invStatus(i){const t=invTotal(i),p=invPaid(i);if(p>=t-0.5&&t>0)return'Pago';if(p>0)return'Parcial';if(i.due&&i.due<today())return'Vencido';return'Por pagar'}
const linkedSum=i=>S.records.filter(r=>r.invId===i.id).reduce((s,r)=>s+n(r.total),0);
function recFin(r){if(!r.invId)return'Não faturado';const i=S.invoices.find(x=>x.id===r.invId);return i?invStatus(i):'Não faturado'}
function balance(pid){const inv=S.invoices.filter(i=>!pid||i.pid===pid).reduce((s,i)=>s+invTotal(i),0);const pay=S.payments.filter(p=>!pid||p.pid===pid).reduce((s,p)=>s+n(p.amount),0);return inv-pay}
const unbilled=pid=>S.records.filter(r=>(!pid||r.pid===pid)&&!r.invId&&prov(r.pid).cat!=='subscricao').reduce((s,r)=>s+n(r.total),0);
const pillFin=s=>`<span class="pill ${{'Pago':'p-ok','Parcial':'p-info','Por pagar':'p-info','Vencido':'p-bad','Não faturado':'p-warn'}[s]||''}">${esc(s)}</span>`;
function pillSt(r){const c=cat(r.pid),s=r.status||c.statuses[0];return`<span class="pill ${s==='Problema'?'p-bad':c.final.includes(s)?'p-ok':''}">${esc(s)}</span>`}

/* ---------- alerts: the checks Moussa used to do by hand ---------- */
function alerts(pid){const A=[],add=(sev,t,open,p)=>A.push({sev,t,open,pid:p});
 const R=S.records.filter(r=>!pid||r.pid===pid),I=S.invoices.filter(i=>!pid||i.pid===pid);
 for(const r of R){const c=prov(r.pid).cat,nm=prov(r.pid).name,lab=r.slip||r.ref||r.title||r.vehicle||dd(r.date);
  if(c==='transporte'&&r.status==='Chegou'&&!r.invId&&days(r.date)>30)add('warn',`${nm}: talão ${lab} chegou há ${days(r.date)} dias e ainda não está faturado`,['rec',r.id],r.pid);
  if(['viaturas','suporte'].includes(c)&&CATS[c].final.includes(r.status)&&!r.invId&&days(r.date)>30)add('warn',`${nm}: ${lab} concluído há ${days(r.date)} dias e sem fatura`,['rec',r.id],r.pid);
  if(c==='transporte'&&r.status==='A caminho'&&days(r.date)>7)add('warn',`${nm}: talão ${lab} a caminho há ${days(r.date)} dias — confirmar chegada`,['rec',r.id],r.pid);
  const e=expected(r);if(e!=null&&Math.abs(e-n(r.total))>1)add(n(r.total)>e?'bad':'info',`${nm}: talão ${lab} cobrado ${mt0(r.total)} · tabela dá ${mt0(e)} (${n(r.total)>e?'+':''}${mt0(n(r.total)-e)})`,['rec',r.id],r.pid);
  if(c==='publicidade'&&r.invId){const st=CATS.publicidade.statuses.indexOf(r.status),i=S.invoices.find(x=>x.id===r.invId),adv=n(prov(r.pid).advance);
   if(i&&adv&&st>=2&&st<=4&&invPaid(i)<invTotal(i)*adv/100-1)add('warn',`${nm}: ${lab} aprovado sem adiantamento de ${adv}% registado`,['rec',r.id],r.pid);
   if(i&&st>=5&&invPaid(i)<invTotal(i)-1)add('warn',`${nm}: ${lab} entregue — falta pagar ${mt0(invTotal(i)-invPaid(i))}`,['inv',i.id],r.pid)}
  if(['publicidade','viaturas','suporte'].includes(c)&&r.status!=='Problema'&&!CATS[c].final.includes(r.status)&&r.status!=='Entregue / instalado'&&days(r.statusAt||r.date)>14)add('info',`${nm}: ${lab} parado em “${r.status}” há ${days(r.statusAt||r.date)} dias`,['rec',r.id],r.pid);
  if(r.status==='Problema')add('bad',`${nm}: ${lab} marcado com problema`,['rec',r.id],r.pid);
  if(r.check)add('info',`${nm}: ${lab} — por confirmar (CHECK)`,['rec',r.id],r.pid)}
 const seen={};for(const i of I){const k=i.pid+'|'+String(i.no).trim().toLowerCase();if(seen[k])add('bad',`${prov(i.pid).name}: fatura nº ${i.no} registada duas vezes`,['inv',i.id],i.pid);seen[k]=1;
  const ls=linkedSum(i),cnt=S.records.filter(r=>r.invId===i.id).length,st=invStatus(i);
  if(cnt&&Math.abs(ls-n(i.sub))>1)add('bad',`${prov(i.pid).name}: fatura ${i.no} — subtotal ${mt0(i.sub)} ≠ soma dos movimentos ligados ${mt0(ls)}`,['inv',i.id],i.pid);
  if(!cnt&&['transporte','viaturas'].includes(prov(i.pid).cat)&&st!=='Pago')add('warn',`${prov(i.pid).name}: fatura ${i.no} sem talões/reparações ligados`,['inv',i.id],i.pid);
  if(st==='Vencido')add('bad',`${prov(i.pid).name}: fatura ${i.no} vencida há ${days(i.due)} dias — ${mt0(invTotal(i)-invPaid(i))}`,['inv',i.id],i.pid);
  if(invPaid(i)>invTotal(i)+1)add('bad',`${prov(i.pid).name}: fatura ${i.no} paga a mais (${mt0(invPaid(i)-invTotal(i))})`,['inv',i.id],i.pid);
  if(i.check)add('info',`${prov(i.pid).name}: fatura ${i.no} — por confirmar (CHECK)`,['inv',i.id],i.pid)}
 A.push(...trAlerts(pid));const o={bad:0,warn:1,info:2};return A.sort((a,b)=>o[a.sev]-o[b.sev])}

 if(!loaded){m.innerHTML='<div class="empty">A carregar…</div>';return}

 b.innerHTML=bad.length?`<div class="banner"><span>⚠ ${bad.length} ${bad.length===1?'ponto crítico':'pontos críticos'}: ${esc(bad[0].t)}${bad.length>1?' …':''}</span><button data-go="painel">Resolver agora</button></div>`:''}
function drawChips(){const c=$('#chips');if(isWH()){c.innerHTML=`<button class="chip on"><b>${esc(prov(V.p).name)}</b><span>transferências</span></button>`;return}const ps=[...S.providers].sort((a,b)=>(a.order??99)-(b.order??99));
 c.innerHTML=`<button class="chip ${V.p==='painel'?'on':''}" data-go="painel"><b>Painel</b><span>${mt0(balance())} em dívida</span></button>`+
 ps.map(p=>{const b=balance(p.id),na=loaded?alerts(p.id).filter(a=>a.sev!=='info').length:0;return`<button class="chip ${V.p===p.id?'on':''}" data-go="${p.id}"><b>${esc(p.name)}${na?`<span class="badge">${na}</span>`:''}</b><span>${b>0.5?mt0(b):'em dia'}</span></button>`}).join('')+
 (isAdmin?`<button class="chip" data-act="newProv"><b>+ Prestador</b><span>adicionar</span></button>`:'')}

function viewPainel(){const A=alerts(),owed=balance(),over=S.invoices.filter(i=>invStatus(i)==='Vencido').reduce((s,i)=>s+invTotal(i)-invPaid(i),0);
 const ym=today().slice(0,7),paidM=S.payments.filter(p=>(p.date||'').startsWith(ym)).reduce((s,p)=>s+n(p.amount),0);
 const months=[];for(let k=11;k>=0;k--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-k);months.push(d.toISOString().slice(0,7))}
 const fat=months.map(m=>S.invoices.filter(i=>(i.date||'').startsWith(m)).reduce((s,i)=>s+invTotal(i),0)),pag=months.map(m=>S.payments.filter(p=>(p.date||'').startsWith(m)).reduce((s,p)=>s+n(p.amount),0));
 const mx=Math.max(1,...fat,...pag);
 const rows=S.providers.map(p=>({p,b:balance(p.id),u:unbilled(p.id),o:S.invoices.filter(i=>i.pid===p.id&&invStatus(i)!=='Pago').length})).sort((a,b)=>b.b-a.b);
 return`<div class="head"><div><h2>${owed>0.5?(()=>{const k=rows.filter(r=>r.b>0.5).length;return`Deve ${mt0(owed)} a ${k} ${k===1?'prestador':'prestadores'}`})():'Tudo pago'}</h2><p>${A.filter(a=>a.sev==='bad').length} pontos críticos · ${A.length} alertas no total</p></div></div>
 <div class="kpis"><div class="kpi hot"><small>Total em dívida</small><div>${mt0(owed)}</div></div><div class="kpi"><small>Vencido</small><div>${mt0(over)}</div></div>
 <div class="kpi"><small>Recebido mas ainda não faturado</small><div>${mt0(unbilled())}</div></div><div class="kpi"><small>Pago este mês</small><div>${mt0(paidM)}</div></div></div>
 <div class="grid2"><div><div class="card"><h3>O que precisa de atenção <span class="sub">${A.length}</span></h3>${A.length?A.slice(0,40).map(alertRow).join(''):'<div class="empty">Sem alertas. Tudo confere.</div>'}${A.length>40?`<p class="note">+${A.length-40} alertas — abra cada prestador para ver todos.</p>`:''}</div></div>
 <div><div class="card"><h3>Saldo por prestador</h3><div class="scroll"><table><thead><tr><th>Prestador</th><th class="num">Em dívida</th><th class="num">Não faturado</th></tr></thead><tbody>
 ${rows.map(r=>`<tr class="click" data-go="${r.p.id}"><td><b>${esc(r.p.name)}</b><div class="sub">${esc(CATS[r.p.cat]?.label||'')}${r.o?` · ${r.o} fatura(s) aberta(s)`:''}</div></td><td class="num">${r.b>0.5?mt0(r.b):'—'}</td><td class="num">${r.u?mt0(r.u):'—'}</td></tr>`).join('')}</tbody></table></div></div>
 <div class="card"><h3>Faturado vs pago · 12 meses</h3><div class="bars">${months.map((m,k)=>`<div class="b" title="${m}: faturado ${mt0(fat[k])}, pago ${mt0(pag[k])}"><div class="col" style="height:${Math.max(2,fat[k]/mx*100)}%"><i style="height:${fat[k]?Math.min(100,pag[k]/fat[k]*100):0}%"></i></div><small>${m.slice(5)}</small></div>`).join('')}</div>
 <p class="note">Barra clara = faturado no mês · parte escura = pago no mesmo mês.</p></div>
 <div class="card"><h3>Últimos registos</h3>${S.log.slice(0,10).map(l=>`<div class="sub" style="padding:5px 0;border-bottom:1px solid var(--line)">${dd(l.at)} ${String(l.at||'').slice(11,16)} · ${esc(l.t)}</div>`).join('')||'<div class="sub">Ainda sem atividade.</div>'}</div></div></div>`}
const alertRow=a=>`<div class="alert" data-open="${a.open.join(':')}"><span class="dot ${a.sev==='bad'?'bad':a.sev==='info'?'info':''}"></span><div>${esc(a.t)}</div></div>`;

function viewProv(pid){const p=prov(pid),c=CATS[p.cat],b=balance(pid),A=alerts(pid),T=V.tab;
 const tabs=isWH()?[['trf','Transferências']]:[['mov',c.plural],...(p.cat==='transporte'?[['trf','Transferências']]:[]),['fat','Faturas'],['pag','Pagamentos'],['cc','Conta corrente'],['pre',p.cat==='transporte'?'Tabela de preços':'Itens & preços'],['alr',`Alertas (${A.length})`],['fic','Ficha']];
 const op=S.invoices.filter(i=>i.pid===pid&&invStatus(i)!=='Pago');

 ${canWrite?`<button class="btn" data-act="openImport">Importar Excel</button><button class="btn" data-act="newRec">+ ${esc(c.noun)}</button><button class="btn" data-act="newInv">+ Fatura</button><button class="btn pri" data-act="newPay">+ Pagamento</button>`:''}</div>
 <div class="kpis"><div class="kpi ${b>0.5?'hot':''}"><small>Saldo em dívida</small><div>${mt0(b)}</div></div><div class="kpi"><small>Faturas abertas</small><div>${op.length}</div></div>
 <div class="kpi"><small>${esc(c.plural)} não faturados</small><div>${mt0(unbilled(pid))}</div></div><div class="kpi"><small>Pago em ${today().slice(0,4)}</small><div>${mt0(S.payments.filter(x=>x.pid===pid&&(x.date||'').startsWith(today().slice(0,4))).reduce((s,x)=>s+n(x.amount),0))}</div></div></div>

 ${T==='trf'?tabTrf(pid):T==='mov'?tabMov(pid):T==='fat'?tabFat(pid):T==='pag'?tabPag(pid):T==='cc'?tabCC(pid):T==='pre'?tabPre(pid):T==='alr'?(A.map(alertRow).join('')||'<div class="empty">Sem alertas para este prestador.</div>'):tabFic(pid)}`}

 <td class="num">${r.total?mt0(r.total):'—'}</td>${tr?`<td class="num ${df?'diff':''}">${e==null?'<span class="sub">—</span>':mt0(e)}</td><td>${(()=>{const x=recTransfer(r);return x?`<a href="#" data-open="trf:${x.id}">${esc(x.doc_no||x.doc_type)}</a> ${pillMatch(tfin(x).match)}`:'<span class="sub">—</span>'})()}</td>`:''}<td>${pillSt(r)}</td><td>${pillFin(recFin(r))}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty">Sem ${esc(c.plural.toLowerCase())} ${V.fs||V.ff||V.fm?'com estes filtros':'ainda'}. Use “+ ${esc(c.noun)}”.</div>`}`}

async function compress(f){if(!/^image\//.test(f.type)||f.type==='image/gif')return f;try{const bmp=await createImageBitmap(f);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
 const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.72));return b&&b.size<f.size?new File([b],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f}catch{return f}}

 (cur.o.files=cur.o.files||[]).push({path,name:f0.name,type:f.type,size:f.size});toast(`Anexado (${Math.round(f.size/1024)} KB)`)}catch(e){toast('Falhou: '+(e.message||e))}}await signFiles(cur.o.files);rerender()}

/* invoice check by pasted lines (free, no AI) */
function parsePasted(txt){const out=[];for(const raw of txt.split(/\r?\n/)){const line=raw.trim();if(!line)continue;const cells=line.split(/\t|;|\s{2,}/).map(c=>c.trim()).filter(Boolean);
 let slip='',date='',amount=null;for(const c of cells){if(!date&&/^\d{1,2}[./-]\d{1,2}[./-]\d{2,4}$/.test(c)){const a=c.split(/[./-]/);let y=+a[2];if(y<100)y+=2000;date=`${y}-${String(a[1]).padStart(2,'0')}-${String(a[0]).padStart(2,'0')}`;continue}
  if(!slip&&/^\d{6,7}$/.test(c)){slip=c;continue}}
 const nums=cells.map(c=>c.replace(/\s/g,'')).filter(c=>/^-?[\d,.]+$/.test(c)&&/[\d]/.test(c)&&!/^\d{6,7}$/.test(c)&&!/^\d{1,3}$/.test(c));
 if(nums.length){const v=nums[nums.length-1];amount=n(v.includes(',')&&!v.includes('.')&&/,\d{2}$/.test(v)?v.replace(',','.'):v)}
 if(!slip&&amount==null)continue;out.push({slip,date,d:cells.filter(c=>!/^[\d,.\s]+$/.test(c)).join(' '),amount:amount||0})}return out}
async function checkInvoice({text}){const i=cur.o;const L=parsePasted(text);if(!L.length)return toast('Não encontrei linhas com talão ou valor');
 const R=S.records.filter(r=>r.pid===i.pid),by={};
 for(const l of L){const k=String(l.slip||'').trim();const key=k||('·'+(l.date||'')+(l.d||'')+Math.random());(by[key]=by[key]||{slip:k,date:l.date,d:[],amt:0}).d.push(l.d);by[key].amt+=n(l.amount)}
 const rows=[];let miss=0,diff=0,ok=0;
 for(const g of Object.values(by)){const r=g.slip?R.find(x=>String(x.slip||'').trim()===g.slip):null;
  if(r){cur.sel.add(r.id);const d=Math.abs(n(r.total)-g.amt)>1&&g.amt;d?diff++:ok++;rows.push(`<tr><td>${esc(g.slip)}</td><td>${esc(g.d.join(' + '))}</td><td class="num">${mt0(g.amt)}</td><td class="num">${mt0(r.total)}</td><td>${d?'<span class="pill p-bad">valor diferente</span>':'<span class="pill p-ok">confere</span>'}</td></tr>`)}
  else{miss++;rows.push(`<tr><td>${esc(g.slip||'sem talão')}<div class="sub">${dd(g.date)}</div></td><td>${esc(g.d.join(' + '))}</td><td class="num">${mt0(g.amt)}</td><td class="num">—</td><td><span class="pill p-warn">sem registo</span></td></tr>`)}}
 const notIn=R.filter(r=>!r.invId&&r.slip&&!by[String(r.slip).trim()]);
 cur.chk=`<div class="card"><h3>Conferência da fatura <span class="sub">${L.length} linhas lidas</span></h3><p class="sub" style="margin:0 0 8px">${ok} conferem · <span class="${diff?'diff':''}">${diff} com valor diferente</span> · <span class="${miss?'diff':''}">${miss} sem talão registado</span> · ${notIn.length} talões registados que a fatura não inclui</p>
 <div class="scroll" style="max-height:300px;overflow-y:auto"><table><thead><tr><th>Talão</th><th>Linha na fatura</th><th class="num">Fatura</th><th class="num">Registado</th><th></th></tr></thead><tbody>${rows.join('')}</tbody></table></div>
 ${notIn.length?`<p class="note">Registados mas fora desta fatura: ${notIn.map(r=>esc(r.slip)).join(', ')}</p>`:''}<p class="note">Os talões que conferem ficaram marcados abaixo. Verifique e guarde.</p></div>`;refreshInv();toast('Fatura conferida')}

const TR_PLACES=['MAPUTO','BEIRA','NAMPULA'],TR_TYPES=['Transferência','N/Factura','V/Factura','N/VD','V/VD','Contentor'],TR_ST=['A preparar','A caminho','Chegou','Problema'],MATCH=['Pendente','Confirmado','Não confere'];
const TRACK_FROM='2026-11-24';
const isWH=()=>ME.role==='warehouse';
const trSent=t=>(t.lines||[]).reduce((s,l)=>s+n(l.q),0);
const slipKeys=t=>new Set((t.slips||[]).map(x=>String(x).trim().toUpperCase()).filter(Boolean));
function trRecs(t){const k=slipKeys(t);return k.size?S.records.filter(r=>r.pid===t.pid&&(k.has(String(r.slip||'').toUpperCase())||k.has(String(r.ref||'').toUpperCase()))):[]}
function recTransfer(r){const k=[r.slip,r.ref].filter(Boolean).map(x=>String(x).toUpperCase());return k.length?S.transfers.find(t=>t.pid===r.pid&&(t.slips||[]).some(s=>k.includes(String(s).trim().toUpperCase()))):null}
const tfin=t=>S.tfin[t.id]||{match:'Pendente'};
const cap=s=>s?s[0]+s.slice(1).toLowerCase():'';
function pillTr(s){return`<span class="pill ${s==='Problema'?'p-bad':s==='Chegou'?'p-ok':s==='A caminho'?'p-info':''}">${esc(s)}</span>`}
function pillMatch(m){return`<span class="pill ${m==='Confirmado'?'p-ok':m==='Não confere'?'p-bad':'p-warn'}">${esc(m)}</span>`}
function trAlerts(pid){const A=[];for(const t of S.transfers.filter(x=>!pid||x.pid===pid)){const lab=`${t.doc_type} ${t.doc_no||''}`.trim(),nm=`${cap(t.origin)} → ${cap(t.dest)}`;
 if(t.status==='A caminho'&&days(t.date)>7)A.push({sev:'warn',t:`${nm}: ${lab} em trânsito há ${days(t.date)} dias — confirmar chegada`,open:['trf',t.id],pid:t.pid});
 if(t.status==='Problema')A.push({sev:'bad',t:`${nm}: ${lab} marcado com problema`,open:['trf',t.id],pid:t.pid});
 if(t.received_qty!=null&&t.received_qty!==''&&trSent(t)&&n(t.received_qty)!==trSent(t))A.push({sev:'bad',t:`${nm}: ${lab} — enviado ${trSent(t)}, recebido ${n(t.received_qty)}`,open:['trf',t.id],pid:t.pid});
 if(!isWH()&&tfin(t).match==='Não confere')A.push({sev:'bad',t:`${nm}: ${lab} não confere com o transportador`,open:['trf',t.id],pid:t.pid})}
 if(!isWH())for(const r of S.records.filter(x=>(!pid||x.pid===pid)&&prov(x.pid).cat==='transporte'&&(x.date||'')>=TRACK_FROM))if(!recTransfer(r))A.push({sev:'info',t:`${prov(r.pid).name}: talão ${r.slip||r.ref||dd(r.date)} sem documento nosso ligado`,open:['rec',r.id],pid:r.pid});
 return A}

function tabTrf(pid){const wh=isWH();let T=S.transfers.filter(t=>t.pid===pid);const q=$('#q').value.trim().toLowerCase();
 if(wh&&V.mine!=='0'&&ME.loc)T=T.filter(t=>t.origin===ME.loc||t.dest===ME.loc);
 if(V.ts)T=T.filter(t=>t.status===V.ts);if(V.tm&&!wh)T=T.filter(t=>tfin(t).match===V.tm);if(V.fm)T=T.filter(t=>(t.date||'').startsWith(V.fm));if(q)T=T.filter(t=>JSON.stringify(t).toLowerCase().includes(q));

 <div class="sec">Pré-visualização<span class="sub">${P.recs.length} registos · ${mt(tot)}${P.skipped.length?` · ${P.skipped.length} já existem (ignorados)`:''}</span></div>
 <div class="scroll" style="max-height:340px;overflow-y:auto"><table><thead><tr><th>Data</th><th>Talão / ref</th><th>Rota</th><th>Linhas</th><th class="num">Valor</th></tr></thead><tbody>
 ${P.recs.slice(0,200).map(r=>`<tr><td>${dd(r.date)}</td><td>${esc(r.slip||r.ref||'')}</td><td>${esc(r.origin?r.origin+' → '+r.dest:'')}</td><td>${esc(r.lines.map(l=>`${l.q} ${l.d}`).join(', '))}${r.check?' <span class="flag">CHECK</span>':''}</td><td class="num">${mt0(r.total)}</td></tr>`).join('')}</tbody></table></div>`:''}`}
async function impLoadFile(f){try{await loadXLSX();const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});const I=cur.imp;I.name=f.name;I.wb=wb;I.sheets=wb.SheetNames;I.sheet=wb.SheetNames[0];impSheet();
 if(!I.invNo){const m=f.name.match(/(?:fact|fat|inv|fatura)[^\d]*(\d+)/i);if(m)I.invNo=m[1]}repaint(impForm())}catch(e){toast('Não consegui ler o ficheiro: '+(e.message||e))}}
function impSheet(){const I=cur.imp;I.rows=XLSX.utils.sheet_to_json(I.wb.Sheets[I.sheet],{header:1,raw:true,defval:null});
 let best=0,bi=0;I.rows.slice(0,20).forEach((r,i)=>{const sc=(r||[]).filter(v=>v!=null&&Object.values(IMP_RX).some(rx=>rx.test(String(v).trim()))).length;if(sc>best){best=sc;bi=i}});I.head=bi;impAutoMap()}
function impAutoMap(){const I=cur.imp,h=I.rows[I.head]||[],M={};for(const[k]of IMP_FIELDS){const i=h.findIndex((v,ix)=>v!=null&&IMP_RX[k].test(String(v).trim())&&!Object.values(M).includes(String(ix))&&!(k==='amount'&&IMP_RX.price.test(String(v))));M[k]=i>=0?String(i):''}
 if(M.desc===''){const i=h.findIndex(v=>v==null);}I.map=M}
function impRead(){const I=cur.imp;for(const el of $('#dBody').querySelectorAll('[data-k]')){const k=el.dataset.k;if(k==='_sheet'&&el.value!==I.sheet){I.sheet=el.value;impSheet();return}
  if(k==='_head'){const h=Math.max(0,parseInt(el.value||'1')-1);if(h!==I.head){I.head=h;impAutoMap();return}}
  if(k==='_status')I.status=el.value;if(k==='_company')I.company=el.value;if(k==='_mkInv')I.mkInv=el.checked;if(k==='_invNo')I.invNo=el.value;if(k==='_invDate')I.invDate=el.value;if(k.startsWith('_m_'))I.map[k.slice(3)]=el.value}}
async function runImport(){impRead();const I=cur.imp,P=impParse();if(!P.recs.length)return;if(I.mkInv&&!I.invNo)return toast('Indique o nº da fatura');
 const b=$('#impGo');b.disabled=true;b.textContent='A importar…';
 try{let invId=null;if(I.mkInv){const inv={pid:cur.o.pid,no:I.invNo,date:I.invDate,company:I.company,sub:Math.round(P.recs.reduce((s,r)=>s+n(r.total),0)*100)/100,disc:0,vat:0,files:[],notes:`Importada de ${I.name}`};invId=await put('invoices',inv)}
  const rows=P.recs.map(r=>{r.id=crypto.randomUUID();r.invId=invId||'';r.statusAt=r.date;r.history=[{s:r.status,at:r.date}];return toRow.records(r)});
  for(let i=0;i<rows.length;i+=200){const {error}=await sb.from('prest_records').insert(rows.slice(i,i+200));if(error)throw error}
  await loadKey('records');log(cur.o.pid,`Importou ${rows.length} registos de ${I.name}${I.mkInv?' · fatura '+I.invNo:''} · ${mt0(P.recs.reduce((s,r)=>s+n(r.total),0))}`);closeDrawer();V.tab='mov';draw();toast(`${rows.length} registos importados`)}
 catch(e){b.disabled=false;b.textContent='Importar';fail(e)}}

/* ---------- Supabase data layer ---------- */
const TB={providers:'prest_providers',rates:'prest_rates',records:'prest_records',invoices:'prest_invoices',payments:'prest_payments'};
const REC_COLS=['id','pid','date','status','status_at','slip','ref','company','total','inv_id','chk','lines','history','doc','notes','files'];
const fromRow={
 providers:r=>({...r,order:r.ord,files:r.files||[]}),
 rates:r=>({...r,from:r.valid_from,price:+r.price}),
 records:r=>({...(r.doc||{}),id:r.id,pid:r.pid,date:r.date,status:r.status,statusAt:r.status_at,slip:r.slip||'',ref:r.ref||'',company:r.company||'',total:+r.total,invId:r.inv_id||'',check:r.chk,lines:r.lines||[],history:r.history||[],notes:r.notes||'',files:r.files||[]}),
 invoices:r=>({id:r.id,pid:r.pid,no:r.no,date:r.date,due:r.due||'',company:r.company||'',sub:+r.sub,disc:+r.disc,vat:+r.vat,check:r.chk,notes:r.notes||'',files:r.files||[]}),
 payments:r=>({id:r.id,pid:r.pid,invId:r.inv_id||'',date:r.date,amount:+r.amount,method:r.method||'',ref:r.ref||'',company:r.company||'',check:r.chk,notes:r.notes||'',files:r.files||[]})};
const nz=v=>v===''||v==null?null:v;
const toRow={
 providers:p=>({id:p.id,name:p.name,cat:p.cat,nuit:nz(p.nuit),phone:nz(p.phone),email:nz(p.email),address:nz(p.address),terms:p.terms===''||p.terms==null?null:n(p.terms),advance:p.advance===''||p.advance==null?null:n(p.advance),company:nz(p.company),bank:nz(p.bank),pcts:nz(p.pcts),notes:nz(p.notes),ord:p.order===''||p.order==null?99:n(p.order),files:p.files||[],updated_at:new Date().toISOString()}),
 rates:r=>({id:r.id,pid:r.pid,route:nz(r.route),item:r.item,per:r.per||'cx',price:n(r.price),valid_from:r.from,note:nz(r.note)}),
 records:r=>{const doc={};for(const[k,v]of Object.entries(r))if(!['id','pid','date','status','statusAt','slip','ref','company','total','invId','check','lines','history','notes','files'].includes(k)&&v!==''&&v!=null)doc[k]=v;
  return{id:r.id,pid:r.pid,date:nz(r.date),status:r.status,status_at:nz(r.statusAt),slip:nz(r.slip),ref:nz(r.ref),company:nz(r.company),total:n(r.total),inv_id:nz(r.invId),chk:!!r.check,lines:r.lines||[],history:r.history||[],doc,notes:nz(r.notes),files:r.files||[],updated_at:new Date().toISOString()}},
 invoices:i=>({id:i.id,pid:i.pid,no:String(i.no),date:nz(i.date),due:nz(i.due),company:nz(i.company),sub:n(i.sub),disc:n(i.disc),vat:n(i.vat),total:invTotal(i),chk:!!i.check,notes:nz(i.notes),files:i.files||[],updated_at:new Date().toISOString()}),
 payments:p=>({id:p.id,pid:p.pid,inv_id:nz(p.invId),date:nz(p.date),amount:n(p.amount),method:nz(p.method),ref:nz(p.ref),company:nz(p.company),chk:!!p.check,notes:nz(p.notes),files:p.files||[],updated_at:new Date().toISOString()})};
async function fetchAll(t){let out=[],from=0;for(;;){const {data,error}=await sb.from(t).select('*').range(from,from+999);if(error)throw error;out=out.concat(data);if(data.length<1000)break;from+=1000}return out}
async function loadKey(k){S[k]=(await fetchAll(TB[k])).map(fromRow[k]);if(k==='records')S.records.sort((a,b)=>(b.date||'').localeCompare(a.date||''))}
async function loadLog(){const {data}=await sb.from('prest_log').select('*').order('at',{ascending:false}).limit(60);S.log=(data||[]).map(l=>({at:l.at,t:(l.user_name?l.user_name+': ':'')+l.txt}))}
async function loadSettings(){const {data}=await sb.from('prest_settings').select('*').eq('id',1).maybeSingle();if(data)S.settings={...S.settings,companies:data.companies||[],vehicles:data.vehicles||[]}}
async function loadAll(){if(isWH())await loadKey('providers'),V.p=(S.providers.find(p=>p.cat==='transporte')||{id:'aca'}).id;await Promise.all([...(isWH()?['providers']:Object.keys(TB)).map(loadKey),isWH()?null:loadLog(),loadSettings(),loadTransfers()]);loaded=true;render()}
async function put(k,o){if(!canWrite)throw new Error('Sem permissão para gravar');if(!o.id)o.id=crypto.randomUUID();const {error}=await sb.from(TB[k]).upsert(toRow[k](o));if(error)throw error;
 const i=S[k].findIndex(x=>x.id===o.id);const v=fromRow[k](toRow[k](o));if(i>=0)S[k][i]=v;else S[k].push(v);render();return o.id}
async function patch(k,id,obj){const {error}=await sb.from(TB[k]).update(obj).eq('id',id);if(error)throw error}
async function remove(k,id){const {error}=await sb.from(TB[k]).delete().eq('id',id);if(error)throw error;S[k]=S[k].filter(x=>x.id!==id);render()}
const log=(pid,t)=>sb.from('prest_log').insert({pid:pid||null,txt:t,user_name:ME.nome}).then(()=>loadLog().then(render)).catch(()=>{});
let rtTimer={};function live(){const ch=sb.channel('prest-live');for(const[k,t]of Object.entries(TB).filter(([k])=>!isWH()||k==='providers'))ch.on('postgres_changes',{event:'*',schema:'public',table:t},()=>{clearTimeout(rtTimer[k]);rtTimer[k]=setTimeout(()=>loadKey(k).then(render),600)});
 for(const t of ['prest_transfers','prest_transfer_fin'])ch.on('postgres_changes',{event:'*',schema:'public',table:t},()=>{clearTimeout(rtTimer.tr);rtTimer.tr=setTimeout(loadTransfers,600)});
 ch.on('postgres_changes',{event:'*',schema:'public',table:'prest_settings'},()=>loadSettings().then(render)).subscribe()}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{const t=e.target.closest('[data-go],[data-tab],[data-open],[data-act]');if(!t)return;
 if(t.dataset.go){V.p=t.dataset.go;V.tab='mov';V.fs=V.ff=V.fm='';$('#q').value='';draw();scrollTo(0,0);return}
 if(t.dataset.tab){V.tab=t.dataset.tab;draw();return}
 if(t.dataset.open){const[k,id]=t.dataset.open.split(':');if(k==='rec')openRec(id);if(k==='inv')openInv(id);if(k==='pay')openPay(id);if(k==='trf')openTrf(id);return}
 const a=t.dataset.act;
 ({close:closeDrawer,newRec:()=>openRec(null,V.p!=='painel'?V.p:null),newInv:()=>openInv(null),newPay:()=>openPay(null),newProv:()=>openProv(null),editProv:()=>openProv(V.p),
  newRate:()=>openRate(null),editRate:()=>openRate(t.dataset.id),saveRate,delRate:()=>del('rates',cur.o.id,'este preço'),saveProv,saveSet,
  saveRec,delRec:()=>del('records',cur.o.id,'este movimento'),saveInv,delInv:()=>del('invoices',cur.o.id,'a fatura '+cur.o.no),savePay,delPay:()=>del('payments',cur.o.id,'este pagamento'),
  setSt:()=>{cur.o.status=t.dataset.s;refreshRec()},addLine:()=>{readLines();cur.o.lines.push({});refreshRec()},
  addEstrada:()=>{readLines();const its=itemOpts(cur.o);cur.o.lines.push({item:its.includes('ESTRADA')?'ESTRADA':'',d:'Estrada',q:1,p:''});refreshRec()},
  rmLine:()=>{readLines();cur.o.lines.splice(+t.dataset.i,1);refreshRec()},
  addFile:()=>$('#fileIn').click(),rmFile:()=>{cur.o.files.splice(+t.dataset.i,1);rerender()},
  
  pasteInv:()=>{cur.chk=`<div class="card"><h3>Colar linhas da fatura</h3><textarea id="pasteBox" style="width:100%;min-height:140px;border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--panel)" placeholder="Copie as linhas do Excel do prestador e cole aqui"></textarea><button class="btn sm pri" data-act="runPaste" style="margin-top:8px">Conferir</button></div>`;refreshInv()},
  runPaste:async()=>{const txt=$('#pasteBox').value.trim();if(!txt)return;try{await checkInvoice({text:txt})}catch(err){toast('Erro: '+(err.message||err))}},
  selAll:()=>{readForm(cur.o);for(const r of S.records.filter(r=>r.pid===cur.o.pid&&!r.invId))cur.sel.add(r.id);refreshInv()},
  useSum:()=>{readForm(cur.o);cur.o.sub=Math.round(S.records.filter(r=>cur.sel.has(r.id)).reduce((s,r)=>s+n(r.total),0)*100)/100;refreshInv()},
  payThis:()=>openPay(null,cur.o.pid,cur.o.id),newTrf:()=>openTrf(null),saveTrf,delTrf:()=>delTrf(),trSt:()=>{readTr();cur.o.status=t.dataset.s;repaint(trForm())},trAddLine:()=>{readTr();cur.o.lines.push({});repaint(trForm())},trRmLine:()=>{readTr();cur.o.lines.splice(+t.dataset.i,1);repaint(trForm())},openUsers,uSave,uDel,uNew:()=>{cur.o={};repaint(usersForm())},uEdit:()=>{cur.o={...cur.list.find(u=>u.user_id===t.dataset.id)};repaint(usersForm())},openImport,pickXls:()=>$('#xlsIn').click(),runImport,setLang:()=>{try{localStorage.setItem('pp_lang',t.dataset.l)}catch{}location.reload()},expCC:exportCC
 }[a]||(()=>{}))()});
document.addEventListener('change',e=>later(()=>onChange(e)));
function onChange(e){const t=e.target;if(!t.isConnected&&!t.dataset.f)return;
 if(t.dataset.f){V[t.dataset.f]=t.value;draw();return}
 if(t.dataset.pick){cur.sel[t.checked?'add':'delete'](t.dataset.pick);refreshInv();return}
 if(!cur)return;
 if(cur.type==='imp'&&t.dataset.k&&t.dataset.k.startsWith('_')){impRead();repaint(impForm());return}
 if(cur.type==='trf'){refreshTr();return}
 if(cur.type==='users'&&t.dataset.k==='_role'){readU();repaint(usersForm());return}
 if(cur.type==='rec'&&(t.dataset.lk==='item'||['origin','dest','date','pid'].includes(t.dataset.k))){readLines();readForm(cur.o);if(t.dataset.lk==='item'){const l=cur.o.lines[+t.dataset.l];const r=rateFor(cur.o.pid,routeOf(cur.o),l.item,cur.o.date);if(r)l.p=r.price;if(r&&r.per==='viagem'&&!l.q)l.q=1}refreshRec();return}
 if(cur.type==='rec'&&(t.dataset.lk==='q'||t.dataset.lk==='p'||['base','pct','province'].includes(t.dataset.k))){readLines();readForm(cur.o);if(t.dataset.k==='province'){const m=String(prov(cur.o.pid).pcts||'').split('\n').map(s=>s.split('=')).find(([a])=>a&&a.trim().toLowerCase()===String(cur.o.province).toLowerCase());if(m)cur.o.pct=n(m[1])}refreshRec();return}
 if(cur.type==='rec'&&t.dataset.lk==='d'){readLines();const l=cur.o.lines[+t.dataset.l];if(l&&!l.p){const last=S.records.filter(x=>x.pid===cur.o.pid).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).flatMap(x=>x.lines||[]).find(x=>x.d===l.d&&n(x.p));if(last){l.p=last.p;refreshRec()}}return}
 if(cur.type==='inv'&&['sub','disc','vat','pid','date'].includes(t.dataset.k)){refreshInv();return}
 if(cur.type==='pay'&&t.dataset.k==='invId'){readForm(cur.o);const i=S.invoices.find(z=>z.id===cur.o.invId);if(i&&!n(cur.o.amount)){cur.o.amount=Math.round((invTotal(i)-invPaid(i))*100)/100;cur.o.company=cur.o.company||i.company}rerender()}
 if(cur.type==='pay'&&t.dataset.k==='pid'){readForm(cur.o);cur.o.invId='';rerender()}}
$('#xlsIn').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f&&cur&&cur.type==='imp')impLoadFile(f)});
$('#fileIn').addEventListener('change',e=>{const f=[...e.target.files];e.target.value='';if(f.length)onFiles(f)});

$('#ov').onclick=closeDrawer;$('#dClose').onclick=closeDrawer;$('#newBtn').onclick=newMenu;$('#setBtn').onclick=()=>isAdmin?openSettings():toast('Só o administrador');$('#outBtn').onclick=()=>sb.auth.signOut().then(()=>location.reload());$('#expBtn').onclick=exportAll;
let qt;$('#q').addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(draw,200)});
setTimeout(()=>{let on=true;try{on=localStorage.getItem('pp_big')!=='0'}catch(e){}setBig(on);$('#dFull').onclick=()=>setBig(!$('#drawer').classList.contains('big'))},0);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#drawer').classList.contains('on'))closeDrawer()});

/* ---------- boot ---------- */
function showLogin(err){$('#login').style.display='flex';$('#lg_err').textContent=err||''}
async function start(session){sessionUid=session.user.id;const {data,error}=await sb.from('prest_users').select('nome,role,loc').eq('user_id',session.user.id).maybeSingle();
 if(error||!data){await sb.auth.signOut();return showLogin(error?'Sem ligação: '+error.message:'Esta conta não tem acesso ao sistema de Prestadores.')}
 ME=data;canWrite=['admin','editor'].includes(ME.role);isAdmin=ME.role==='admin';$('#who').textContent=`${ME.nome} · ${{admin:'Administrador',editor:'Edição',viewer:'Só leitura',warehouse:'Armazém'}[ME.role]}`;
 if(!canWrite)$('#newBtn').style.display='none';if(!isAdmin)$('#setBtn').style.display='none';
 if(isWH()){$('#expBtn').style.display='none';$('#newBtn').style.display='';$('#newBtn').onclick=()=>openTrf(null);V.p=(S.providers.find(p=>p.cat==='transporte')||{id:'aca'}).id;V.tab='trf';$('#who').textContent=`${ME.nome} · Armazém ${cap(ME.loc||'')}`}
 $('#login').style.display='none';draw();try{await loadAll();live()}catch(e){loaded=true;$('#main').innerHTML=`<div class="empty">Erro ao carregar: ${esc(e.message||e)}</div>`}}
$('#lgf').addEventListener('submit',async e=>{e.preventDefault();const b=$('#lg_b');b.disabled=true;$('#lg_err').textContent='';
 let em=$('#lg_e').value.trim().toLowerCase();if(!em.includes('@'))em=em.replace(/\s+/g,'.')+'@'+USER_DOMAIN;const {data,error}=await sb.auth.signInWithPassword({email:em,password:$('#lg_p').value});b.disabled=false;
 if(error)return showLogin(/invalid/i.test(error.message)?'Email ou palavra-passe errados':error.message);start(data.session)});
sb.auth.getSession().then(({data})=>data.session?start(data.session):showLogin());
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&loaded)loadAll()});
}
