<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">

<style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#1d2330;--mute:#6b7280;--line:#e5e7eb;--band:#1F3864;--band2:#2f5597;--acc:#c5221f;--ok:#1e8e3e;--warn:#b06000;--info:#1967d2;--soft:#eef2f8}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;line-height:1.1;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.band{background:var(--band);color:#fff;padding:18px max(4vw,16px) 0}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-size:22px;margin-right:auto}.top h1 small{display:block;font:500 13px -apple-system,Segoe UI,Roboto,Arial,sans-serif;opacity:.7}
.search{flex:1 1 220px;max-width:360px;background:#ffffff1a;border:1px solid #ffffff33;border-radius:10px;padding:10px 12px;color:#fff}
.search::placeholder{color:#ffffffaa}
.btn{min-height:42px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.ghost{background:transparent;color:#fff;border-color:#ffffff55}
.btn.sm{min-height:34px;padding:4px 10px;font-size:14px}.btn.link{border:0;background:none;color:var(--info);padding:4px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:3px solid #7fa6ff;outline-offset:1px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:16px 0 0;scrollbar-width:thin}
.chip{flex:none;border:0;background:transparent;color:#ffffffc0;padding:10px 14px 12px;border-radius:10px 10px 0 0;cursor:pointer;text-align:left;min-height:44px}
.chip b{display:block;font-weight:600;color:#fff}.chip span{font-size:12.5px}
.chip.on{background:var(--bg);color:var(--ink)}.chip.on b{color:var(--ink)}
main{padding:22px max(4vw,16px) 60px;max-width:1320px;margin:0 auto}
.head{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.head h2{font-size:clamp(24px,3vw,34px);margin-right:auto}.head p{margin:4px 0 0;color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi small{color:var(--mute);font-weight:500}.kpi div{font:700 clamp(20px,2.4vw,26px) -apple-system,Segoe UI,Roboto,Arial,sans-serif;margin-top:4px;white-space:nowrap}
.kpi.hot{background:var(--acc);border-color:var(--acc);color:#fff}.kpi.hot small{color:#ffffffd0}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
@media(max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.card h3{font-size:17px;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{flex:none;border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--mute);font-weight:600;border-bottom:3px solid transparent;min-height:44px}
.tab.on{color:var(--ink);border-color:var(--acc)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input{min-height:40px;border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:6px 10px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-weight:600;color:var(--mute);font-size:13px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--soft);color:var(--mute)}
.p-ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.p-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.p-bad{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
.p-info{background:color-mix(in srgb,var(--info) 15%,transparent);color:var(--info)}
.sub{color:var(--mute);font-size:13px}
.alert{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.alert:last-child{border:0}.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--warn)}.dot.bad{background:var(--acc)}.dot.info{background:var(--info)}
.bars{display:flex;align-items:flex-end;gap:6px;height:190px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .col{width:100%;max-width:34px;background:var(--soft);border-radius:6px 6px 0 0;position:relative;overflow:hidden}
.bars .col i{position:absolute;left:0;right:0;bottom:0;background:var(--band2)}
.bars small{font-size:11.5px;color:var(--mute)}
.banner{background:#c5221f;color:#fff;padding:10px max(4vw,16px);display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-weight:600}
.banner button{background:#fff;color:#c5221f;border:0;border-radius:6px;padding:6px 14px;font-weight:700;cursor:pointer;min-height:34px}
.badge{background:#c5221f;color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:5px;font-weight:700}
#login{position:fixed;inset:0;background:#f3f4f6;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#login .box{background:#fff;padding:28px 24px;border-radius:12px;width:100%;max-width:360px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
#login h2{margin:0 0 4px;color:#1F3864;font-size:20px}#login p{margin:0 0 18px;color:#6b7280;font-size:13px}
#login label{display:block;font-size:13px;color:#374151;margin-bottom:12px}#login input{width:100%;margin-top:4px;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:16px}
#login button{width:100%;background:#1F3864;color:#fff;border:0;border-radius:8px;padding:11px;font-weight:700;font-size:15px;cursor:pointer}#login .e{color:#c5221f;font-size:13px;min-height:18px;margin-bottom:6px}
.empty{padding:28px;text-align:center;color:var(--mute)}
.flag{color:var(--acc);font-weight:700;font-size:12px}
/* drawer */
.ov{position:fixed;inset:0;background:#050b1c99;display:none;z-index:20}
.ov.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:21;transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{background:var(--band);color:#fff;padding:16px 20px;display:flex;gap:10px;align-items:center}
.dh h3{font-size:19px;margin-right:auto}
.db{padding:18px 20px;overflow-y:auto;flex:1}
.df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:var(--panel)}
.df .grow{margin-right:auto}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form .full{grid-column:1/-1}
@media(max-width:600px){.form{grid-template-columns:minmax(0,1fr)}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--mute)}
label.f input,label.f select,label.f textarea,.lines input,.lines select{min-height:42px;border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:8px 10px;font-size:16px;font-weight:400;color:var(--ink);width:100%}
textarea{min-height:70px;resize:vertical}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.step{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:7px 12px;cursor:pointer;font-size:13.5px;font-weight:600;min-height:38px}
.step.done{background:var(--soft)}.step.on{background:var(--band);color:#fff;border-color:var(--band)}
.step.bad.on{background:var(--acc);border-color:var(--acc)}
.lines{width:100%;border-collapse:collapse;margin-top:6px}.lines td{padding:4px;border:0}.lines th{padding:4px}
.files{display:flex;flex-wrap:wrap;gap:8px}
.file{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:6px;display:flex;gap:8px;align-items:center;max-width:240px;font-size:13px}
.file img{width:52px;height:52px;object-fit:cover;border-radius:6px}
.file a{color:var(--info);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec{font:700 14px -apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:18px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ai{background:var(--soft);border-radius:12px;padding:12px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ai p{margin:0;flex:1 1 220px;font-size:13.5px;color:var(--mute)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--band);color:#fff;padding:10px 16px;border-radius:10px;z-index:40;display:none;max-width:90vw}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);border-radius:14px;padding:20px;z-index:31;width:min(420px,92vw);display:none}
.modal.on{display:block}.modal p{margin:0 0 16px}
.mback{position:fixed;inset:0;background:#050b1c99;z-index:30;display:none}.mback.on{display:block}
.hist{font-size:13px;color:var(--mute);margin:8px 0 0;padding-left:18px}
.tot{display:flex;justify-content:flex-end;gap:20px;flex-wrap:wrap;margin-top:8px;font-weight:600}
.diff{color:var(--acc);font-weight:700}
.ok{color:var(--ok);font-weight:700}
.note{font-size:13px;color:var(--mute);margin-top:10px}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute);font-size:12px}.stack td:empty{display:none}.top h1{font-size:19px}}
@media(prefers-reduced-motion:reduce){.drawer{transition:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>

<body>
<div class="band">
  <div class="top">
    <h1>Madi Prestadores<small id="who">Controlo de pagamentos a prestadores de serviços</small></h1>
    <input class="search" id="q" type="search" placeholder="Procurar talão, fatura, matrícula, projeto…" autocomplete="off">
    <button class="btn pri" id="newBtn">+ Novo</button>
    <button class="btn ghost" id="expBtn">Exportar Excel</button>
    <button class="btn ghost" id="setBtn">Definições</button>
    <button class="btn ghost" id="outBtn" title="Sair">Sair</button>
  </div>
  <nav class="chips" id="chips"></nav>
</div>
<div id="bannerBox"></div>
<main id="main"><div class="empty">A carregar…</div></main>

<div class="ov" id="ov"></div>
<aside class="drawer" id="drawer" aria-modal="true" role="dialog">
  <div class="dh"><h3 id="dTitle"></h3><button class="btn ghost sm" id="dClose">Fechar</button></div>
  <div class="db" id="dBody"></div>
  <div class="df" id="dFoot"></div>
</aside>
<div class="mback" id="mback"></div>
<div class="modal" id="modal"><p id="mText"></p><div style="display:flex;gap:8px;justify-content:flex-end" id="mBtns"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" multiple accept="image/*,application/pdf" hidden>
<div id="login" style="display:none"><div class="box"><h2>Madi Prestadores</h2><p>Controlo de pagamentos a prestadores</p>
<form id="lgf"><label>Email<input id="lg_e" type="email" autocomplete="username" required></label><label>Palavra-passe<input id="lg_p" type="password" autocomplete="current-password" required></label><div class="e" id="lg_err"></div><button id="lg_b">Entrar</button></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<script>
{
/* ---------- configuration ---------- */
const CATS={
 transporte:{label:'Transporte',noun:'Envio / talão',plural:'Envios',statuses:['A preparar','A caminho','Chegou','Problema'],final:['Chegou'],
  fields:[['slip','Talão / Nr entrada'],['ref','Referência (R/M/B)'],['origin','Origem','sel:places'],['dest','Destino','sel:places'],['sender','Fornecedor da mercadoria'],['consignee','Cliente / armazém destino'],['load','Carga','sel:loads']]},
 publicidade:{label:'Publicidade & gráfica',noun:'Projeto',plural:'Projetos',statuses:['Pedido','Cotação recebida','Aprovado','Em produção','Pronto','Entregue / instalado','Concluído ✓','Problema'],final:['Concluído ✓'],
  fields:[['title','Projeto / pedido','full'],['ltype','Onde','sel:where'],['location','Local / detalhe'],['att','Pedido por'],['quote','Nº cotação / VD'],['deadline','Prazo de entrega','date']]},
 viaturas:{label:'Oficina / viaturas',noun:'Reparação',plural:'Reparações',statuses:['Na oficina','Em reparação','Pronto','Entregue','Problema'],final:['Entregue'],
  fields:[['vehicle','Viatura (matrícula)','list:vehicles'],['km','Km','num'],['title','Trabalho feito','full']]},
 suporte:{label:'Suporte técnico',noun:'Serviço',plural:'Serviços',statuses:['Pedido','Em curso','Concluído','Problema'],final:['Concluído'],
  fields:[['title','Serviço','full'],['location','Local / loja'],['warranty','Garantia até','date']]},
 subscricao:{label:'Subscrição / software',noun:'Mensalidade',plural:'Mensalidades',statuses:['Pendente','Serviço recebido','Problema'],final:['Serviço recebido'],
  fields:[['period','Mês','month'],['title','Descrição']]},
 comissao:{label:'Transporte Shoprite (%)',noun:'Envio Shoprite',plural:'Envios Shoprite',statuses:['A caminho','Entregue','Problema'],final:['Entregue'],
  fields:[['sinv','Fatura Shoprite nº'],['province','Província','sel:provinces'],['base','Valor da fatura Shoprite (MT)','num'],['pct','% do transportador','num']]}
};
const LISTS={places:['MPT','BEIRA','NPL','QUELIMANE','PEMBA','TETE','CHIMOIO','NACALA','OUTRO'],loads:['Solto','Contentor 20"','Contentor 40"'],
 where:['Camião','Viatura','Loja','Cliente','Billboard','Evento','Escritório','Outro'],
 provinces:['Maputo Cidade','Maputo Província','Gaza','Inhambane','Sofala','Manica','Tete','Zambézia','Nampula','Cabo Delgado','Niassa']};
const METHODS=['Transferência','Cheque','Numerário','M-Pesa','eMola','Compensação'];
const PLACE={MPT:'Maputo',BEIRA:'Beira',NPL:'Nampula'};

/* ---------- state ---------- */
const SB_URL='https://erxlksuoplobtfbsvypg.supabase.co',SB_PK='sb_publishable_M5dLHCm5GFfgzP0g0Ol9lQ_3vjLme_l',BUCKET='prestadores';
const sb=supabase.createClient(SB_URL,SB_PK,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'madi-prest-auth'}});
let ME={nome:'',role:'viewer'},canWrite=false,isAdmin=false,db=true;
const S={providers:[],rates:[],records:[],invoices:[],payments:[],log:[],settings:{companies:['CPCM','K Import','Casa Perfumaria','Galerie Madi','Tsutsuma','Elite'],vehicles:[]}};
const V={p:'painel',tab:'mov',fs:'',ff:'',fm:''};
let loaded=false,cur=null;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>{if(typeof v==='number')return v;const x=parseFloat(String(v??'').replace(/[\s,]/g,''));return isFinite(x)?x:0};
const mt=v=>(Math.round(n(v)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' MT';
const mt0=v=>Math.round(n(v)).toLocaleString('en-US')+' MT';
const today=()=>new Date().toISOString().slice(0,10);
const dd=d=>d?String(d).slice(0,10).split('-').reverse().join('/'):'';
const days=d=>d?Math.floor((Date.now()-new Date(d+'T00:00:00'))/864e5):0;
const addDays=(d,k)=>{const x=new Date((d||today())+'T00:00:00');x.setDate(x.getDate()+k);return x.toISOString().slice(0,10)};
const prov=id=>S.providers.find(p=>p.id===id)||{name:'?',cat:'transporte'};
const cat=pid=>CATS[prov(pid).cat]||CATS.transporte;
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3200)};
const clone=o=>JSON.parse(JSON.stringify(o));
const strip=o=>{const c=clone(o);delete c.id;return c};
function ask(msg,ok='Confirmar'){return new Promise(res=>{$('#mText').textContent=msg;$('#mBtns').innerHTML=`<button class="btn" data-a="0">Cancelar</button><button class="btn pri" data-a="1">${esc(ok)}</button>`;
 $('#modal').classList.add('on');$('#mback').classList.add('on');$('#mBtns').onclick=e=>{const a=e.target.dataset.a;if(a==null)return;$('#modal').classList.remove('on');$('#mback').classList.remove('on');res(a==='1')}})}

/* ---------- money logic ---------- */
const lineSum=r=>(r.lines||[]).reduce((s,l)=>s+n(l.q||0)*n(l.p||0),0);
function recTotal(r){let t=lineSum(r);if(prov(r.pid).cat==='comissao')t+=n(r.base)*n(r.pct)/100;return Math.round(t*100)/100}
function rateFor(pid,route,item,date){return S.rates.filter(x=>x.pid===pid&&x.route===route&&x.item===item&&(x.from||'')<=(date||today())).sort((a,b)=>(b.from||'').localeCompare(a.from||''))[0]}
const routeOf=r=>r.origin&&r.dest?r.origin+'-'+r.dest:'';
function expected(r){if(prov(r.pid).cat!=='transporte'||!(r.lines||[]).length)return null;let t=0;
 for(const l of r.lines){if(!l.item)return null;const x=rateFor(r.pid,routeOf(r),l.item,r.date);if(!x)return null;t+=(x.per==='viagem'?1:n(l.q))*n(x.price)}return t}
const invPaid=i=>S.payments.filter(p=>p.invId===i.id).reduce((s,p)=>s+n(p.amount),0);
const invTotal=i=>Math.round((n(i.sub)-n(i.disc))*(1+n(i.vat)/100)*100)/100;
function invStatus(i){const t=invTotal(i),p=invPaid(i);if(p>=t-0.5&&t>0)return'Pago';if(p>0)return'Parcial';if(i.due&&i.due<today())return'Vencido';return'Por pagar'}
const linkedSum=i=>S.records.filter(r=>r.invId===i.id).reduce((s,r)=>s+n(r.total),0);
function recFin(r){if(!r.invId)return'Não faturado';const i=S.invoices.find(x=>x.id===r.invId);return i?invStatus(i):'Não faturado'}
function balance(pid){const inv=S.invoices.filter(i=>!pid||i.pid===pid).reduce((s,i)=>s+invTotal(i),0);const pay=S.payments.filter(p=>!pid||p.pid===pid).reduce((s,p)=>s+n(p.amount),0);return inv-pay}
const unbilled=pid=>S.records.filter(r=>(!pid||r.pid===pid)&&!r.invId&&prov(r.pid).cat!=='subscricao').reduce((s,r)=>s+n(r.total),0);
const pillFin=s=>`<span class="pill ${{'Pago':'p-ok','Parcial':'p-info','Por pagar':'p-info','Vencido':'p-bad','Não faturado':'p-warn'}[s]||''}">${esc(s)}</span>`;
function pillSt(r){const c=cat(r.pid),s=r.status||c.statuses[0];return`<span class="pill ${s==='Problema'?'p-bad':c.final.includes(s)?'p-ok':''}">${esc(s)}</span>`}

/* ---------- alerts: the checks Moussa used to do by hand ---------- */
function alerts(pid){const A=[],add=(sev,t,open,p)=>A.push({sev,t,open,pid:p});
 const R=S.records.filter(r=>!pid||r.pid===pid),I=S.invoices.filter(i=>!pid||i.pid===pid);
 for(const r of R){const c=prov(r.pid).cat,nm=prov(r.pid).name,lab=r.slip||r.ref||r.title||r.vehicle||dd(r.date);
  if(c==='transporte'&&r.status==='Chegou'&&!r.invId&&days(r.date)>30)add('warn',`${nm}: talão ${lab} chegou há ${days(r.date)} dias e ainda não está faturado`,['rec',r.id],r.pid);
  if(['viaturas','suporte'].includes(c)&&CATS[c].final.includes(r.status)&&!r.invId&&days(r.date)>30)add('warn',`${nm}: ${lab} concluído há ${days(r.date)} dias e sem fatura`,['rec',r.id],r.pid);
  if(c==='transporte'&&r.status==='A caminho'&&days(r.date)>7)add('warn',`${nm}: talão ${lab} a caminho há ${days(r.date)} dias — confirmar chegada`,['rec',r.id],r.pid);
  const e=expected(r);if(e!=null&&Math.abs(e-n(r.total))>1)add(n(r.total)>e?'bad':'info',`${nm}: talão ${lab} cobrado ${mt0(r.total)} · tabela dá ${mt0(e)} (${n(r.total)>e?'+':''}${mt0(n(r.total)-e)})`,['rec',r.id],r.pid);
  if(c==='publicidade'&&r.invId){const st=CATS.publicidade.statuses.indexOf(r.status),i=S.invoices.find(x=>x.id===r.invId),adv=n(prov(r.pid).advance);
   if(i&&adv&&st>=2&&st<=4&&invPaid(i)<invTotal(i)*adv/100-1)add('warn',`${nm}: ${lab} aprovado sem adiantamento de ${adv}% registado`,['rec',r.id],r.pid);
   if(i&&st>=5&&invPaid(i)<invTotal(i)-1)add('warn',`${nm}: ${lab} entregue — falta pagar ${mt0(invTotal(i)-invPaid(i))}`,['inv',i.id],r.pid)}
  if(['publicidade','viaturas','suporte'].includes(c)&&r.status!=='Problema'&&!CATS[c].final.includes(r.status)&&r.status!=='Entregue / instalado'&&days(r.statusAt||r.date)>14)add('info',`${nm}: ${lab} parado em “${r.status}” há ${days(r.statusAt||r.date)} dias`,['rec',r.id],r.pid);
  if(r.status==='Problema')add('bad',`${nm}: ${lab} marcado com problema`,['rec',r.id],r.pid);
  if(r.check)add('info',`${nm}: ${lab} — por confirmar (CHECK)`,['rec',r.id],r.pid)}
 const seen={};for(const i of I){const k=i.pid+'|'+String(i.no).trim().toLowerCase();if(seen[k])add('bad',`${prov(i.pid).name}: fatura nº ${i.no} registada duas vezes`,['inv',i.id],i.pid);seen[k]=1;
  const ls=linkedSum(i),cnt=S.records.filter(r=>r.invId===i.id).length,st=invStatus(i);
  if(cnt&&Math.abs(ls-n(i.sub))>1)add('bad',`${prov(i.pid).name}: fatura ${i.no} — subtotal ${mt0(i.sub)} ≠ soma dos movimentos ligados ${mt0(ls)}`,['inv',i.id],i.pid);
  if(!cnt&&['transporte','viaturas'].includes(prov(i.pid).cat)&&st!=='Pago')add('warn',`${prov(i.pid).name}: fatura ${i.no} sem talões/reparações ligados`,['inv',i.id],i.pid);
  if(st==='Vencido')add('bad',`${prov(i.pid).name}: fatura ${i.no} vencida há ${days(i.due)} dias — ${mt0(invTotal(i)-invPaid(i))}`,['inv',i.id],i.pid);
  if(invPaid(i)>invTotal(i)+1)add('bad',`${prov(i.pid).name}: fatura ${i.no} paga a mais (${mt0(invPaid(i)-invTotal(i))})`,['inv',i.id],i.pid);
  if(i.check)add('info',`${prov(i.pid).name}: fatura ${i.no} — por confirmar (CHECK)`,['inv',i.id],i.pid)}
 const o={bad:0,warn:1,info:2};return A.sort((a,b)=>o[a.sev]-o[b.sev])}

const ta=(k,l,v,cls='full')=>`<label class="f ${cls}">${esc(l)}<textarea data-k="${k}">${esc(v??'')}</textarea></label>`;

 if(t==='full')return inp(k,l,v,'text','full');if(t==='date')return inp(k,l,v,'date');if(t==='month')return inp(k,l,v,'month');if(t==='num')return inp(k,l,v);

async function compress(f){if(!/^image\//.test(f.type)||f.type==='image/gif')return f;try{const bmp=await createImageBitmap(f);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
 const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.72));return b&&b.size<f.size?new File([b],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f}catch{return f}}

 const path=`${cur.o.pid||'geral'}/${today().slice(0,7)}/${crypto.randomUUID()}${f.type==='application/pdf'?'.pdf':'.jpg'}`;const {error}=await sb.storage.from(BUCKET).upload(path,f,{contentType:f.type,upsert:false});if(error)throw error;

/* invoice check by pasted lines (free, no AI) */
function parsePasted(txt){const out=[];for(const raw of txt.split(/\r?\n/)){const line=raw.trim();if(!line)continue;const cells=line.split(/\t|;|\s{2,}/).map(c=>c.trim()).filter(Boolean);
 let slip='',date='',amount=null;for(const c of cells){if(!date&&/^\d{1,2}[./-]\d{1,2}[./-]\d{2,4}$/.test(c)){const a=c.split(/[./-]/);let y=+a[2];if(y<100)y+=2000;date=`${y}-${String(a[1]).padStart(2,'0')}-${String(a[0]).padStart(2,'0')}`;continue}
  if(!slip&&/^\d{6,7}$/.test(c)){slip=c;continue}}
 const nums=cells.map(c=>c.replace(/\s/g,'')).filter(c=>/^-?[\d,.]+$/.test(c)&&/[\d]/.test(c)&&!/^\d{6,7}$/.test(c)&&!/^\d{1,3}$/.test(c));
 if(nums.length){const v=nums[nums.length-1];amount=n(v.includes(',')&&!v.includes('.')&&/,\d{2}$/.test(v)?v.replace(',','.'):v)}
 if(!slip&&amount==null)continue;out.push({slip,date,d:cells.filter(c=>!/^[\d,.\s]+$/.test(c)).join(' '),amount:amount||0})}return out}
async function checkInvoice({text}){const i=cur.o;const L=parsePasted(text);if(!L.length)return toast('Não encontrei linhas com talão ou valor');
 const R=S.records.filter(r=>r.pid===i.pid),by={};
 for(const l of L){const k=String(l.slip||'').trim();const key=k||('·'+(l.date||'')+(l.d||'')+Math.random());(by[key]=by[key]||{slip:k,date:l.date,d:[],amt:0}).d.push(l.d);by[key].amt+=n(l.amount)}
 const rows=[];let miss=0,diff=0,ok=0;
 for(const g of Object.values(by)){const r=g.slip?R.find(x=>String(x.slip||'').trim()===g.slip):null;
  if(r){cur.sel.add(r.id);const d=Math.abs(n(r.total)-g.amt)>1&&g.amt;d?diff++:ok++;rows.push(`<tr><td>${esc(g.slip)}</td><td>${esc(g.d.join(' + '))}</td><td class="num">${mt0(g.amt)}</td><td class="num">${mt0(r.total)}</td><td>${d?'<span class="pill p-bad">valor diferente</span>':'<span class="pill p-ok">confere</span>'}</td></tr>`)}
  else{miss++;rows.push(`<tr><td>${esc(g.slip||'sem talão')}<div class="sub">${dd(g.date)}</div></td><td>${esc(g.d.join(' + '))}</td><td class="num">${mt0(g.amt)}</td><td class="num">—</td><td><span class="pill p-warn">sem registo</span></td></tr>`)}}
 const notIn=R.filter(r=>!r.invId&&r.slip&&!by[String(r.slip).trim()]);
 cur.chk=`<div class="card"><h3>Conferência da fatura <span class="sub">${L.length} linhas lidas</span></h3><p class="sub" style="margin:0 0 8px">${ok} conferem · <span class="${diff?'diff':''}">${diff} com valor diferente</span> · <span class="${miss?'diff':''}">${miss} sem talão registado</span> · ${notIn.length} talões registados que a fatura não inclui</p>
 <div class="scroll" style="max-height:300px;overflow-y:auto"><table><thead><tr><th>Talão</th><th>Linha na fatura</th><th class="num">Fatura</th><th class="num">Registado</th><th></th></tr></thead><tbody>${rows.join('')}</tbody></table></div>
 ${notIn.length?`<p class="note">Registados mas fora desta fatura: ${notIn.map(r=>esc(r.slip)).join(', ')}</p>`:''}<p class="note">Os talões que conferem ficaram marcados abaixo. Verifique e guarde.</p></div>`;refreshInv();toast('Fatura conferida')}

 if(cur.type==='rec'&&(t.dataset.lk==='q'||t.dataset.lk==='p'||['base','pct','province'].includes(t.dataset.k))){readLines();readForm(cur.o);if(t.dataset.k==='province'){const m=String(prov(cur.o.pid).pcts||'').split('\n').map(s=>s.split('=')).find(([a])=>a&&a.trim().toLowerCase()===String(cur.o.province).toLowerCase());if(m)cur.o.pct=n(m[1])}refreshRec();return}
 if(cur.type==='rec'&&t.dataset.lk==='d'){readLines();const l=cur.o.lines[+t.dataset.l];if(l&&!l.p){const last=S.records.filter(x=>x.pid===cur.o.pid).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).flatMap(x=>x.lines||[]).find(x=>x.d===l.d&&n(x.p));if(last){l.p=last.p;refreshRec()}}return}
 if(cur.type==='inv'&&['sub','disc','vat','pid','date'].includes(t.dataset.k)){refreshInv();return}
 if(cur.type==='pay'&&t.dataset.k==='invId'){readForm(cur.o);const i=S.invoices.find(z=>z.id===cur.o.invId);if(i&&!n(cur.o.amount)){cur.o.amount=Math.round((invTotal(i)-invPaid(i))*100)/100;cur.o.company=cur.o.company||i.company}rerender()}
 if(cur.type==='pay'&&t.dataset.k==='pid'){readForm(cur.o);cur.o.invId='';rerender()}}
$('#fileIn').addEventListener('change',e=>{const f=[...e.target.files];e.target.value='';if(f.length)onFiles(f)});

$('#ov').onclick=closeDrawer;$('#dClose').onclick=closeDrawer;$('#newBtn').onclick=newMenu;$('#setBtn').onclick=()=>isAdmin?openSettings():toast('Só o administrador');$('#outBtn').onclick=()=>sb.auth.signOut().then(()=>location.reload());$('#expBtn').onclick=exportAll;
let qt;$('#q').addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(draw,200)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#drawer').classList.contains('on'))closeDrawer()});

/* ---------- boot ---------- */
function showLogin(err){$('#login').style.display='flex';$('#lg_err').textContent=err||''}
async function start(session){const {data,error}=await sb.from('prest_users').select('nome,role').eq('user_id',session.user.id).maybeSingle();
 if(error||!data){await sb.auth.signOut();return showLogin(error?'Sem ligação: '+error.message:'Esta conta não tem acesso ao sistema de Prestadores.')}
 ME=data;canWrite=['admin','editor'].includes(ME.role);isAdmin=ME.role==='admin';$('#who').textContent=`${ME.nome} · ${{admin:'Administrador',editor:'Edição',viewer:'Só leitura'}[ME.role]}`;
 if(!canWrite)$('#newBtn').style.display='none';if(!isAdmin)$('#setBtn').style.display='none';
 $('#login').style.display='none';draw();try{await loadAll();live()}catch(e){loaded=true;$('#main').innerHTML=`<div class="empty">Erro ao carregar: ${esc(e.message||e)}</div>`}}
$('#lgf').addEventListener('submit',async e=>{e.preventDefault();const b=$('#lg_b');b.disabled=true;$('#lg_err').textContent='';
 const {data,error}=await sb.auth.signInWithPassword({email:$('#lg_e').value.trim(),password:$('#lg_p').value});b.disabled=false;
 if(error)return showLogin(/invalid/i.test(error.message)?'Email ou palavra-passe errados':error.message);start(data.session)});
sb.auth.getSession().then(({data})=>data.session?start(data.session):showLogin());
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&loaded)loadAll()});
}
</script>
